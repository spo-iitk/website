services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: spo-website-dev-temp
    working_dir: /app
    ports:
      - '3000:3000'
      - '4001:4001'
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - .:/app
      - spo_temp_node_modules:/app/node_modules
    command: sh -c "yarn install && yarn dev"
    stdin_open: true
    tty: true

volumes:
  spo_temp_node_modules:
